name: Feature request
description: An idea or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could pgsql-loupe help?
      description: A sketch of the API, panel change or behaviour you have in mind.
    validations:
      required: true
