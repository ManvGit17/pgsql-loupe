# Throwaway PostgreSQL for the prior-art lab. Superuser access is needed for auto_explain.
services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "55432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 1s
      retries: 30
