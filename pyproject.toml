[project]
name = "sqlloupe"
version = "0.0.0"
description = "Debug panel for Python web apps on PostgreSQL: statements, plans, triggers and N+1 warnings per request."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "psycopg[binary]==3.3.9",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
