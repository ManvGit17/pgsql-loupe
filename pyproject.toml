[project]
name = "pgsql-loupe"
version = "0.0.0"
description = "Debug panel for Python web apps on PostgreSQL: statements, plans, triggers and N+1 warnings per request."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
psycopg = ["psycopg>=3.3,<4"]

[dependency-groups]
dev = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "mypy==2.4.1",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.9",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research"]

[tool.ruff.per-file-target-version]
"tests/test_psycopg_py314.py" = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "examples"]
# Template strings (t"...") only parse on Python 3.14+; mypy runs on 3.13 here.
exclude = ['tests/test_psycopg_py314\.py']

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
